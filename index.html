esin Kasir</span>
    <h1>kopi.in</h1>
    <p>Masuk. Ngopi. Nikmati.</p>
    <div id="jam">--:--:--</div>
</header>

<main>
    <section>
        <span class="section-label">Data Pembeli</span>
        <div class="cust-row">
            <div class="cust-field">
                <label>Nama</label>
                <input type="text" id="namaPembeli" placeholder="nama pembeli">
            </div>
            <div class="cust-field">
                <label>No. Meja</label>
                <input type="text" id="nomorMeja" placeholder="meja">
            </div>
        </div>
    </section>

    <section>
        <span class="section-label">Pilih Menu</span>
        <div id="menuList"></div>
        <button id="tambahBtn" onclick="tambahKeStruk()">+ Tambah ke Struk</button>
    </section>

    <section class="tape-wrap">
        <span class="section-label">Struk</span>
        <div class="tape" id="tape">
            <div class="tape-center">
                <div class="toko">kopi.in</div>
                <div class="alamat">Masuk. Ngopi. Nikmati.</div>
            </div>
            <hr class="dash">
            <div id="tapeBody"><div class="tape-empty">belum ada pesanan...</div></div>
        </div>
        <div class="torn"></div>
    </section>

    <section>
        <span class="section-label">Pembayaran</span>
        <div class="pay-box">
            <div class="pay-row">
                <span class="label">Total</span>
                <span class="value" id="totalLabel">Rp.0</span>
            </div>
            <label style="font-size:12px; color:var(--muted);">Uang bayar</label>
            <input type="number" id="bayarInput" placeholder="masukkan nominal">
            <p class="warn" id="warnText">uang gak cukup, kurang Rp.0</p>
            <button id="hitungBtn" onclick="hitungBayar()">Hitung &amp; Cetak Struk</button>
            <button id="resetBtn" onclick="resetTransaksi()">Transaksi Baru</button>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
